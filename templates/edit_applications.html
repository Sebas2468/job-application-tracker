<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Application</title>
  </head>

  <body>
    <h1>Edit Application</h1>

    <nav>
      <a href="/">Dashboard</a> | <a href="/companies">Companies</a> |
      <a href="/jobs">Jobs</a> |
      <a href="/applications">Applications</a>
    </nav>

    <hr />

    <form
      action="{{ url_for('edit_application',
            application_id=application.application_id) }}"
      method="POST"
    >
      <label>Job:</label>
      <select name="job_id" required>
        {% for job in jobs %}
        <option
          value="{{ job.job_id }}"
          {%
          if
          job.job_id=""
          ="application.job_id"
          %}
          selected
          {%
          endif
          %}
        >
          {{ job.job_title }} - {{ job.company_name }}
        </option>
        {% endfor %}
      </select>

      <br /><br />

      <label>Application Date:</label>
      <input
        type="date"
        name="application_date"
        value="{{ application.application_date }}"
        required
      />

      <br /><br />

      <label>Status:</label>
      <select name="status" required>
        {% for status in [ 'Applied', 'Screening', 'Interview', 'Offer',
        'Rejected', 'Withdrawn' ] %}
        <option
          value="{{ status }}"
          {%
          if
          application.status=""
          ="status"
          %}
          selected
          {%
          endif
          %}
        >
          {{ status }}
        </option>
        {% endfor %}
      </select>

      <br /><br />

      <label>Resume Version:</label>
      <input
        type="text"
        name="resume_version"
        maxlength="50"
        value="{{ application.resume_version or '' }}"
      />

      <br /><br />

      <label>
        <input
          type="checkbox"
          name="cover_letter_sent"
          {%
          if
          application.cover_letter_sent
          %}
          checked
          {%
          endif
          %}
        />
        Cover Letter Sent
      </label>

      <br /><br />

      <label>Interview Date:</label>
      <input
        type="date"
        name="interview_date"
        value="{{ application.interview_date }}"
      />

      <br /><br />

      <label>Interview Notes:</label>
      <textarea name="interview_notes">
{{ application.interview_notes }}</textarea
      >

      <br /><br />

      <button type="submit">Save Changes</button>

      <a href="{{ url_for('applications') }}">Cancel</a>
    </form>
  </body>
</html>
