{% extends "base.html" %}
{% set page_title = "Edit Application" %}
{% set active_page = "applications" %}
{% set page_description = "Update your progress and interview details." %}
{% block content %}
<section class="panel"><form class="form-grid"
      action="{{ url_for('edit_application',
            application_id=application.application_id) }}"
      method="POST"
    ><div class="field"><label for="job_id">Job:</label>
      <select id="job_id" name="job_id" required>
        {% for job in jobs %}
        <option
          value="{{ job.job_id }}"
          {%
          if
          job.job_id == application.job_id
          %}
          selected
          {%
          endif
          %}
        >
          {{ job.job_title }} - {{ job.company_name }}
        </option>
        {% endfor %}
      </select></div>
<div class="field"><label for="application_date">Application Date:</label>
      <input id="application_date"
        type="date"
        name="application_date"
        value="{{ application.application_date }}"
        required
      /></div>
<div class="field"><label for="status">Status:</label>
      <select id="status" name="status" required>
        {% for status in [ 'Applied', 'Screening', 'Interview', 'Offer',
        'Rejected', 'Withdrawn' ] %}
        <option
          value="{{ status }}"
          {%
          if
          application.status == status
          %}
          selected
          {%
          endif
          %}
        >
          {{ status }}
        </option>
        {% endfor %}
      </select></div>
<div class="field"><label for="resume_version">Resume Version:</label>
      <input id="resume_version"
        type="text"
        name="resume_version"
        maxlength="50"
        value="{{ application.resume_version or '' }}"
      /></div>
<div class="field field-wide"><label>
        <input
          type="checkbox"
          name="cover_letter_sent"
          {%
          if
          application.cover_letter_sent
          %}
          checked
          {%
          endif
          %}
        />
        Cover Letter Sent
      </label></div>
<div class="field"><label for="interview_date">Interview Date:</label>
      <input id="interview_date"
        type="date"
        name="interview_date"
        value="{{ application.interview_date }}"
      /></div>
<div class="field field-wide"><label for="interview_notes">Interview Notes:</label>
      <textarea id="interview_notes" name="interview_notes">
{{ application.interview_notes }}</textarea
      ></div>


      <div class="form-actions"><button type="submit">Save Changes</button>

      <a href="{{ url_for('applications') }}">Cancel</a>
    </div></form></section>
{% endblock %}
