{% extends "base.html" %}
{% set page_title = "Edit Job" %}
{% set active_page = "jobs" %}
{% set page_description = "Keep this opportunity up to date." %}
{% block content %}
<section class="panel"><form class="form-grid" action="{{ url_for('edit_job', job_id=job.job_id) }}" method="POST"><div class="field"><label for="company_id">Company:</label>
      <select id="company_id" name="company_id" required>
        {% for company in companies %}
        <option
          value="{{ company.company_id }}"
          {%
          if
          company.company_id == job.company_id
          %}
          selected
          {%
          endif
          %}
        >
          {{ company.company_name }}
        </option>
        {% endfor %}
      </select></div>
<div class="field"><label for="job_title">Job Title:</label>
      <input id="job_title"
        type="text"
        name="job_title"
        value="{{ job.job_title }}"
        maxlength="100"
        required
      /></div>
<div class="field"><label for="job_type">Job Type:</label>
      <select id="job_type" name="job_type">
        <option value="">Select Type</option>

        {% for type in ['Full-time', 'Part-time', 'Contract', 'Internship'] %}
        <option
          value="{{ type }}"
          {%
          if
          job.job_type == type
          %}selected{%
          endif
          %}
        >
          {{ type }}
        </option>
        {% endfor %}
      </select></div>
<div class="field"><label for="salary_min">Minimum Salary:</label>
      <input id="salary_min"
        type="number"
        name="salary_min"
        min="0"
        value="{{ job.salary_min if job.salary_min is not none else '' }}"
      /></div>
<div class="field"><label for="salary_max">Maximum Salary:</label>
      <input id="salary_max"
        type="number"
        name="salary_max"
        min="0"
        value="{{ job.salary_max if job.salary_max is not none else '' }}"
      /></div>
<div class="field"><label for="job_url">Job URL:</label>
      <input id="job_url"
        type="url"
        name="job_url"
        maxlength="300"
        value="{{ job.job_url or '' }}"
      /></div>
<div class="field"><label for="date_posted">Date Posted:</label>
      <input id="date_posted"
        type="date"
        name="date_posted"
        value="{{ job.date_posted or '' }}"
      /></div>
<div class="field"><label for="requirements">Required Skills:</label>
      <input id="requirements"
        type="text"
        name="requirements"
        value="{{ job.requirements_text }}"
        placeholder="Python, SQL, Flask"
      /></div>


      <div class="form-actions"><button type="submit">Save Changes</button>

      <a href="{{ url_for('jobs') }}">Cancel</a>
    </div></form></section>
{% endblock %}
