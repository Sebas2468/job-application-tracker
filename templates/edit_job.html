<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Job</title>
  </head>

  <body>
    <h1>Edit Job</h1>

    <nav>
      <a href="/">Dashboard</a> | <a href="/companies">Companies</a> |
      <a href="/jobs">Jobs</a>
    </nav>

    <hr />

    <form action="{{ url_for('edit_job', job_id=job.job_id) }}" method="POST">
      <label>Company:</label>
      <select name="company_id" required>
        {% for company in companies %}
        <option
          value="{{ company.company_id }}"
          {%
          if
          company.company_id=""
          ="job.company_id"
          %}
          selected
          {%
          endif
          %}
        >
          {{ company.company_name }}
        </option>
        {% endfor %}
      </select>

      <br /><br />

      <label>Job Title:</label>
      <input
        type="text"
        name="job_title"
        value="{{ job.job_title }}"
        maxlength="100"
        required
      />

      <br /><br />

      <label>Job Type:</label>
      <select name="job_type">
        <option value="">Select Type</option>

        {% for type in ['Full-time', 'Part-time', 'Contract', 'Internship'] %}
        <option
          value="{{ type }}"
          {%
          if
          job.job_type=""
          ="type"
          %}selected{%
          endif
          %}
        >
          {{ type }}
        </option>
        {% endfor %}
      </select>

      <br /><br />

      <label>Minimum Salary:</label>
      <input
        type="number"
        name="salary_min"
        min="0"
        value="{{ job.salary_min if job.salary_min is not none else '' }}"
      />

      <br /><br />

      <label>Maximum Salary:</label>
      <input
        type="number"
        name="salary_max"
        min="0"
        value="{{ job.salary_max if job.salary_max is not none else '' }}"
      />

      <br /><br />

      <label>Job URL:</label>
      <input
        type="url"
        name="job_url"
        maxlength="300"
        value="{{ job.job_url or '' }}"
      />

      <br /><br />

      <label>Date Posted:</label>
      <input
        type="date"
        name="date_posted"
        value="{{ job.date_posted or '' }}"
      />

      <br /><br />

      <label>Required Skills:</label>
      <input
        type="text"
        name="requirements"
        value="{{ job.requirements_text }}"
        placeholder="Python, SQL, Flask"
      />

      <br /><br />

      <button type="submit">Save Changes</button>

      <a href="{{ url_for('jobs') }}">Cancel</a>
    </form>
  </body>
</html>
