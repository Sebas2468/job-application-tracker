{% extends "base.html" %}
{% set page_title = "Edit Contact" %}
{% set active_page = "contacts" %}
{% set page_description = "Keep your professional connections up to date." %}
{% block content %}
<section class="panel"><form class="form-grid"
      action="{{ url_for('edit_contact', contact_id=contact.contact_id) }}"
      method="POST"
    ><div class="field"><label for="company_id">Company:</label>
      <select id="company_id" name="company_id" required>
        {% for company in companies %}
        <option
          value="{{ company.company_id }}"
          {%
          if
          company.company_id == contact.company_id
          %}
          selected
          {%
          endif
          %}
        >
          {{ company.company_name }}
        </option>
        {% endfor %}
      </select></div>
<div class="field"><label for="contact_name">Contact Name:</label>
      <input id="contact_name"
        type="text"
        name="contact_name"
        value="{{ contact.contact_name }}"
        maxlength="100"
        required
      /></div>
<div class="field"><label for="title">Job Title:</label>
      <input id="title"
        type="text"
        name="title"
        value="{{ contact.title or '' }}"
        maxlength="100"
      /></div>
<div class="field"><label for="email">Email:</label>
      <input id="email"
        type="email"
        name="email"
        value="{{ contact.email or '' }}"
        maxlength="100"
      /></div>
<div class="field"><label for="phone">Phone:</label>
      <input id="phone"
        type="tel"
        name="phone"
        value="{{ contact.phone or '' }}"
        maxlength="20"
      /></div>
<div class="field"><label for="linkedin_url">LinkedIn URL:</label>
      <input id="linkedin_url"
        type="url"
        name="linkedin_url"
        value="{{ contact.linkedin_url or '' }}"
        maxlength="200"
      /></div>
<div class="field field-wide"><label for="notes">Notes:</label>
      <textarea id="notes" name="notes">{{ contact.notes or '' }}</textarea></div>


      <div class="form-actions"><button type="submit">Save Changes</button>

      <a href="{{ url_for('contacts') }}">Cancel</a>
    </div></form></section>
{% endblock %}
