<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Company</title>
  </head>

  <body>
    <h1>Edit Company</h1>

    <form
      action="{{ url_for('edit_company', company_id=company.company_id) }}"
      method="POST"
    >
      <label>Company Name:</label>
      <input
        type="text"
        name="company_name"
        value="{{ company.company_name }}"
        maxlength="100"
        required
      />

      <br /><br />

      <label>Industry:</label>
      <input
        type="text"
        name="industry"
        value="{{ company.industry or '' }}"
        maxlength="50"
      />

      <br /><br />

      <label>Website:</label>
      <input
        type="url"
        name="website"
        value="{{ company.website or '' }}"
        maxlength="200"
      />

      <br /><br />

      <label>City:</label>
      <input
        type="text"
        name="city"
        value="{{ company.city or '' }}"
        maxlength="50"
      />

      <br /><br />

      <label>State:</label>
      <input
        type="text"
        name="state"
        value="{{ company.state or '' }}"
        maxlength="50"
      />

      <br /><br />

      <label>Notes:</label>
      <textarea name="notes">{{ company.notes or '' }}</textarea>

      <br /><br />

      <button type="submit">Save Changes</button>

      <a href="{{ url_for('companies') }}">Cancel</a>
    </form>
  </body>
</html>
